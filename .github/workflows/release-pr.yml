# Keeps a "Release vX.Y.Z" PR open with the next CHANGELOG.md section. Merging
# that PR tags the release and publishes it through release.yml. The tag is
# pushed with GITHUB_TOKEN, which does not trigger other workflows, so the
# release is run here as a reusable workflow call.
name: Release PR
on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            version:
                description: "Version for the release PR, e.g. 0.1.0 (default: next patch, or the open PR's version)"
                required: false
                type: string

concurrency:
    group: release-pr
    cancel-in-progress: false

permissions: {}

jobs:
    plan:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            release_version: ${{ steps.plan.outputs.release_version }}
            release_sha: ${{ steps.plan.outputs.release_sha }}
            prepare_version: ${{ steps.plan.outputs.prepare_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Plan
              id: plan
              run: scripts/release-pr.sh plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_VERSION: ${{ inputs.version }}

    tag:
        needs: plan
        if: needs.plan.outputs.release_version != ''
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Tag the release commit
              run: scripts/release-pr.sh tag "$VERSION" "$SHA"
              env:
                  VERSION: ${{ needs.plan.outputs.release_version }}
                  SHA: ${{ needs.plan.outputs.release_sha }}

    release:
        needs: [plan, tag]
        permissions:
            contents: write
        uses: ./.github/workflows/release.yml
        with:
            tag: v${{ needs.plan.outputs.release_version }}
        secrets: inherit

    prepare:
        needs: [plan, tag]
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.prepare_version != '' && needs.tag.result != 'failure' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  distribution: goreleaser
                  version: "v1.25.1"
                  install-only: true

            - name: Open or refresh the release PR
              run: scripts/release-pr.sh prepare "$VERSION"
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.plan.outputs.prepare_version }}
