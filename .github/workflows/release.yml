# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
# Running it from master (Actions → Release → Run workflow) tags the next patch version first.
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: Release
on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    goreleaser:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Allow goreleaser to access older tag information.
                  fetch-depth: 0

            # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this run releases the tag itself.
            - name: Tag the next patch version
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ "$GITHUB_REF" != refs/heads/master ]; then
                      echo "::error::Run the release from master, not $GITHUB_REF_NAME"
                      exit 1
                  fi
                  tag=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1)
                  if [ -n "$tag" ] && gh release view "$tag" >/dev/null 2>&1; then
                      echo "::error::$GITHUB_SHA is already released as $tag"
                      exit 1
                  fi
                  if [ -z "$tag" ]; then
                      last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
                      IFS=. read -r major minor patch <<<"${last#v}"
                      tag="v$major.$minor.$((patch + 1))"
                      git tag "$tag"
                      git push origin "refs/tags/$tag"
                  fi
                  echo "Releasing $tag"
                  echo "GORELEASER_CURRENT_TAG=$tag" >>"$GITHUB_ENV"
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  cache: true
                  go-version-file: "go.mod"

            - name: Import GPG key
              id: import_gpg
              uses: crazy-max/ghaction-import-gpg@v7
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.PASSPHRASE }}

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                distribution: goreleaser
                version: "v1.25.1"
                args: release --clean
              env:
                GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
