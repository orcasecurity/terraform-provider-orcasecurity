# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: Release
on:
    workflow_dispatch:
    push:
        tags:
            - "v*"
    workflow_call:
        inputs:
            tag:
                description: "Tag to release, e.g. v0.0.63"
                required: true
                type: string
            commit:
                description: "Commit to tag as the release"
                required: true
                type: string

permissions:
    contents: write

jobs:
    goreleaser:
        runs-on: ubuntu-24.04
        env:
            RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.commit || github.ref }}
                  # Allow goreleaser to acce`ss older tag information.
                  fetch-depth: 0

            - name: Tag the release commit
              if: inputs.commit != ''
              run: scripts/changelog.sh tag "$RELEASE_TAG" "$COMMIT"
              env:
                  COMMIT: ${{ inputs.commit }}

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  cache: true
                  go-version-file: "go.mod"

            - name: Import GPG key
              id: import_gpg
              uses: crazy-max/ghaction-import-gpg@v7
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.PASSPHRASE }}

            - name: Release notes from CHANGELOG.md
              run: |
                  if ! scripts/changelog.sh extract "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"; then
                      previous=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname --merged "$RELEASE_TAG^" | sed -n 1p)
                      scripts/changelog.sh notes "$previous" "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
                      echo "::warning::CHANGELOG.md has no section for $RELEASE_TAG; the notes were generated from the commits since $previous. The next \`make changelog\` backfills this version into CHANGELOG.md."
                  fi

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                distribution: goreleaser
                version: "v1.25.1"
                args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
              env:
                GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
                GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
