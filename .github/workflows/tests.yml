name: Run test suite
on:
    workflow_dispatch:
    pull_request:
        paths-ignore:
            - "README.md"
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  cache: true
                  go-version-file: "go.mod"

            - run: go mod download
            - run: go build -v .

    lint:
        name: Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  cache: true
                  go-version-file: "go.mod"

            - run: go mod download

            - name: Run linters
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
              with:
                  # Must be built with Go >= module version (go 1.25+). See https://github.com/golangci/golangci-lint/releases
                  version: v2.11.4

    generate:
        name: Generate artifacts
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version-file: "go.mod"
                  cache: true
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: "1.10.0"
            - run: go generate ./...
            - name: git diff
              run: |
                  git diff --compact-summary --exit-code || \
                    (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

    # examples/ is what tfplugindocs embeds into docs/, and go generate copies it verbatim.
    # Without this gate a stale attribute name in an example ships into the published docs.
    validate-examples:
        name: Validate examples
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version-file: "go.mod"
                  cache: true
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: "1.10.0"
                  terraform_wrapper: false
            - run: go mod download
            - run: make validate-examples

    # Run acceptance tests in a matrix with Terraform CLI versions
    test:
        name: Terraform Provider Unit Tests
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                # list whatever Terraform versions here you would like to support
                terraform:
                    - "1.0.*"
                    - "1.1.*"
                    - "1.2.*"
                    - "1.3.*"
                    - "1.4.*"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version-file: "go.mod"
                  cache: true

            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ matrix.terraform }}
                  terraform_wrapper: false

            - run: go mod download

            - run: make test-ci
              timeout-minutes: 10
              # env:
              #   TF_ACC: "1"
